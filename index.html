<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Tools Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Karla:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tools/quiz-generator/quiz-generator.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#">Learning Tools</a>
  </header>

  <main id="app">
    <section id="catalog-view" class="view">
      <h1>Tools</h1>
      <p class="lede">Pick a tool to start practicing.</p>
      <div id="catalog-grid" class="catalog-grid"></div>
    </section>

    <section id="tool-view" class="view" hidden>
      <button class="btn-back" id="back-to-tools" type="button">← Back to tools</button>
      <div id="tool-container"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Built with vanilla HTML, CSS &amp; JavaScript — no frameworks, no build step.</p>
  </footer>

  <script src="storage.js"></script>
  <script src="tools.js"></script>
  <script src="app.js"></script>
  <script src="tools/quiz-generator/questions.js"></script>
  <script src="tools/quiz-generator/quiz-generator.js"></script>
</body>
</html>
